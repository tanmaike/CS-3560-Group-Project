<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cs-3560-group-project</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
<!-- Vehicle Creation Modal -->
<div id="vehicleModal" class="modal-overlay">
  <div class="modal-card">
    <h2>Register New Vehicle</h2>
    <form id="createVehicleForm">
      <label for="v_cust_id">Owner (Customer ID):</label>
      <input type="number" id="v_cust_id" placeholder="Ex: 301" required[cite: 16]>

      <label for="v_make_model">Vehicle Name/Details:</label>
      <input type="text" id="v_make_model" placeholder="2021 Toyota Corolla" required[cite: 14]>

      <div class="modal-actions">
        <button type="submit" class="btn-primary">Add Vehicle</button>
        <button type="button" onclick="toggleModal('vehicleModal')" class="btn-secondary">Cancel</button>
      </div>
    </form>
  </div>
</div>

<!-- Job Request Modal -->
<div id="jobRequestModal" class="modal-overlay">
  <div class="modal-card">
    <h2>Submit Service Request</h2>
    <form id="createJobForm">
      <label for="j_veh_id">Vehicle ID:</label>
      <input type="number" id="j_veh_id" placeholder="Ex: 5001" required[cite: 16]>

      <label for="j_desc">Describe the Issue:</label>
      <textarea id="j_desc" rows="3" placeholder="Brake inspection or Oil change..." required[cite: 14, 15]></textarea>

      <label for="j_cost">Estimated Budget ($):</label>
      <input type="number" id="j_cost" step="0.01" placeholder="0.00"[cite: 14]>

      <div class="modal-actions">
        <button type="submit" class="btn-primary">Submit to Manager</button>
        <button type="button" onclick="toggleModal('jobRequestModal')" class="btn-secondary">Cancel</button>
      </div>
    </form>
  </div>
</div>

<!-- Payment Processing Modal -->
<div id="paymentModal" class="modal-overlay">
  <div class="modal-card">
    <h2>Finalize Payment</h2>
    <div class="payment-info">
      <p><strong>Customer:</strong> <span id="pay_cust_name">Select Customer</span></p>
      <p><strong>Balance Due:</strong> <span id="pay_balance">$0.00</span></p>
    </div>
    <div class="modal-actions">
      <button onclick="handlePayment()" class="btn-success">Process Full Payment</button>
      <button type="button" onclick="toggleModal('paymentModal')" class="btn-secondary">Close</button>
    </div>
  </div>
</div>
